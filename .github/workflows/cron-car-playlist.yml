name: Cron car-playlist

on:
  # Every hour, see family-playlist for the staggering.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Several crons read a playlist another one writes, so they never overlap
concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      names: car-playlist
    secrets: inherit
