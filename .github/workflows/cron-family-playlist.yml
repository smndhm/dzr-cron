name: Cron family-playlist

on:
  # Every hour. GitHub names the start of the hour as its high load window and
  # says a queued job may be dropped there, so every cron sits in the second
  # half. Minutes are staggered across them so they do not queue behind one
  # another, and so a dropped slot costs one cron rather than all five.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# Several crons read a playlist another one writes, so they never overlap
concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: family-playlist
      action: last-tracks
      arguments: |
        {
          "access_token": "$MY_ACCESS_TOKEN",
          "playlistId": 9499677562,
          "playlists": [
            {
              "access_token": "$MY_ACCESS_TOKEN",
              "playlistId": 1008179901
            },
            {
              "access_token": "$LUCAS_ACCESS_TOKEN",
              "playlistId": 12153531831
            },
            {
              "access_token": "$LYNDS_ACCESS_TOKEN",
              "playlistId": 1696045971
            },
            {
              "access_token": "$MY_ACCESS_TOKEN",
              "playlistId": 183341731
            }
          ],
          "nbTracks": 10
        }
    secrets: inherit
