name: Cron family-playlist

on:
  # Every hour, in the second half: GitHub may drop a job queued at the start of
  # one. Minutes are staggered so a dropped slot costs one cron, not all of them.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: family-playlist
      action: last-tracks
      arguments: |
        {
          "access_token": "$MY_ACCESS_TOKEN",
          "playlistId": 9499677562,
          "playlists": [
            {
              "access_token": "$MY_ACCESS_TOKEN",
              "playlistId": 1008179901
            },
            {
              "access_token": "$LUCAS_ACCESS_TOKEN",
              "playlistId": 12153531831
            },
            {
              "access_token": "$LYNDS_ACCESS_TOKEN",
              "playlistId": 1696045971
            },
            {
              "access_token": "$MY_ACCESS_TOKEN",
              "playlistId": 183341731
            }
          ],
          "nbTracks": 10
        }
    secrets: inherit
