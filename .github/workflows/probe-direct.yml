# Throwaway, and the last one standing. GitHub has never run a scheduled
# workflow in this repository: not the five crons, not this, not the reusable
# twin it was paired with, which is why that twin is gone — both were equally
# silent, so the indirection was never the cause. This one stays as a canary.
# It prints the date every five minutes and costs nothing, because it does not
# run. The day it does, GitHub's scheduler is back and trigger/ can go.
name: Probe direct

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: date -u '+direct probe ran at %H:%M UTC'
