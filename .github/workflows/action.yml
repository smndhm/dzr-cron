name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: smndhm/dev-config/ci/setup@4f61116ca71fba9ca8a8b9e1d4e3953d92edbf57 # main
      - name: Check types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
