name: Deezer crons (daily)

on:
  # Once a day, in the middle of the night: 23:30 UTC is 00:30 or 01:30 in Paris
  # depending on daylight saving, which no listener will notice.
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

# Never let two runs hit the Deezer API at the same time, whatever the schedule
concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      names: remove-duplicates
    secrets: inherit
