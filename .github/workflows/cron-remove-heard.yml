name: Cron remove-heard

on:
  # Every hour, because the listening history only holds about a day of it:
  # measured at 93 tracks covering 25 hours, which a daily run would have to
  # catch on the first try, with no room for a busy evening or a late
  # scheduler. Three calls, so running it often costs nothing.
  schedule:
    - cron: '38 * * * *'
  workflow_dispatch:

# Several crons read a playlist another one writes, so they never overlap
concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: remove-heard
      action: remove-heard
      arguments: |
        {
          "access_token": "$MY_ACCESS_TOKEN",
          "playlistId": 15160366983
        }
    secrets: inherit
