# Steps shared by every cron, never run on its own
name: Deezer cron

on:
  workflow_call:
    inputs:
      cron:
        description: 'Name of the cron, as it appears in the logs'
        required: true
        type: string
      action:
        description: 'last-tracks, sync-playlists or remove-duplicates'
        required: true
        type: string
      arguments:
        description: 'Arguments of the action, as JSON. Tokens are named, never written.'
        required: true
        type: string

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # new-releases writes down the ids it took out, on a branch of its own
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The playlist cannot remember what it no longer holds, and the
      # description holds 255 characters. This branch holds nothing but the file
      # of ids, and no workflow listens to it, so a commit here runs nothing.
      - name: Read what earlier runs poured in
        if: inputs.action == 'new-releases'
        uses: actions/checkout@v7
        with:
          ref: dzr-cron-state
          path: .state
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install modules
        run: pnpm install --frozen-lockfile

      # A second layer over GitHub's own masking of these three
      - name: Mask Deezer access tokens
        run: pnpm run --silent cron:mask
        env:
          MY_ACCESS_TOKEN: ${{ secrets.MY_ACCESS_TOKEN }}
          LYNDS_ACCESS_TOKEN: ${{ secrets.LYNDS_ACCESS_TOKEN }}
          LUCAS_ACCESS_TOKEN: ${{ secrets.LUCAS_ACCESS_TOKEN }}
          CRON_NAME: ${{ inputs.cron }}
          CRON_ACTION: ${{ inputs.action }}
          CRON_ARGUMENTS: ${{ inputs.arguments }}

      # The tokens stay out of the install step, which runs third party code
      - name: Run cron
        run: pnpm run cron:once
        env:
          MY_ACCESS_TOKEN: ${{ secrets.MY_ACCESS_TOKEN }}
          LYNDS_ACCESS_TOKEN: ${{ secrets.LYNDS_ACCESS_TOKEN }}
          LUCAS_ACCESS_TOKEN: ${{ secrets.LUCAS_ACCESS_TOKEN }}
          CRON_NAME: ${{ inputs.cron }}
          CRON_ACTION: ${{ inputs.action }}
          CRON_ARGUMENTS: ${{ inputs.arguments }}

      # always(), because a run that poured tracks in and then failed on
      # something else still has to say so: what it forgets, the next run pours
      # in again the moment the owner takes it out.
      - name: Write down what this run poured in
        if: ${{ always() && inputs.action == 'new-releases' }}
        working-directory: .state
        run: |
          git add --all
          if git diff --quiet --cached; then
            echo 'Nothing new to remember.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(state): what new-releases poured in'
          git push || (git pull --rebase && git push)
