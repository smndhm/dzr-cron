# Steps shared by every schedule. The cadences live in the crons-*.yml files,
# this one never runs on its own.
name: Deezer crons

on:
  workflow_call:
    inputs:
      names:
        description: 'Comma separated names of the crons to run, as set in the configuration. Empty runs them all.'
        required: false
        default: ''
        type: string

jobs:
  run-crons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install modules
        run: pnpm install --frozen-lockfile

      # GitHub masks these three on its own. This registers them again, which
      # also covers a token reaching the logs by another route.
      - name: Mask Deezer access tokens
        run: pnpm run --silent cron:mask
        env:
          MY_ACCESS_TOKEN: ${{ secrets.MY_ACCESS_TOKEN }}
          LYNDS_ACCESS_TOKEN: ${{ secrets.LYNDS_ACCESS_TOKEN }}
          LUCAS_ACCESS_TOKEN: ${{ secrets.LUCAS_ACCESS_TOKEN }}

      # The tokens stay out of the install step, which runs third party code
      - name: Run crons
        run: pnpm run cron:once
        env:
          MY_ACCESS_TOKEN: ${{ secrets.MY_ACCESS_TOKEN }}
          LYNDS_ACCESS_TOKEN: ${{ secrets.LYNDS_ACCESS_TOKEN }}
          LUCAS_ACCESS_TOKEN: ${{ secrets.LUCAS_ACCESS_TOKEN }}
          CRON_NAMES: ${{ inputs.names }}
