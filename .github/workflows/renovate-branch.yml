name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@d1316aeef84394540fcf8701cc9d5e1866e26bb1 # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm run typecheck
        pnpm run lint
        pnpm run test
