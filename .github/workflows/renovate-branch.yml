name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@64ca5c3c80d95caf963a424277d88897e849a0ce # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm run typecheck
        pnpm run lint
        pnpm run test
