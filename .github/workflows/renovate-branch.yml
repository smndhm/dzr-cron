name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@e2b797d7e4cd7b41ffc14cc6dc089439d68bc6ae # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm run typecheck
        pnpm run lint
        pnpm run test
