name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@d1172b5ba229ee2b86d3e0a7d624e9f8cd40017e # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm run typecheck
        pnpm run lint
        pnpm run test
