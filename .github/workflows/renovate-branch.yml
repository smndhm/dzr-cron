name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@a9fc62ee463d5e7c4cde4dd3b996381b53275556 # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        pnpm run typecheck
        pnpm run lint
        pnpm run test
