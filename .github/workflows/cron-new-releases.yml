name: Cron new-releases

on:
  # Every four hours: six slots a day, of which GitHub honours roughly a third
  # on the measurement in the README, so two or three runs and up to twelve
  # hours between them. Two things live inside that gap. A release comes out at
  # midnight local time and is poured in on the next run, so the morning ones
  # decide how soon you hear it. And a track played is taken out on the next
  # run too, which has to happen before it falls out of the listening history —
  # about a day of listening, closer to six hours on a loud one.
  # A run costs a dozen requests, so raising this is cheap if that is not
  # keeping up: the mark in the description means a second run in the same day
  # looks at nothing the first one covered.
  schedule:
    - cron: '48 */4 * * *'
  workflow_dispatch:

# Several crons read a playlist another one writes, so they never overlap
concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: new-releases
      action: new-releases
      arguments: |
        {
          "access_token": "$MY_ACCESS_TOKEN",
          "playlistId": 15160366983,
          "days": 15
        }
    secrets: inherit
