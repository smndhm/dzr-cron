name: Cron new-releases

on:
  # Every four hours: a release is poured in on the next run, and a played track
  # taken out before it falls out of the listening history. See the README.
  schedule:
    - cron: '48 */4 * * *'
  workflow_dispatch:

concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: new-releases
      action: new-releases
      arguments: |
        {
          "access_token": "$MY_ACCESS_TOKEN",
          "playlistId": 15160366983,
          "days": 15
        }
    secrets: inherit
