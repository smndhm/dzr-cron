name: Cron new-releases

on:
  # Once a day: a release does not appear twice in an afternoon, and this cron
  # reads every favourite artist, which is the heaviest of the five. 06:48 UTC
  # is early morning in Paris, and the second half of the hour as the others.
  schedule:
    - cron: '48 6 * * *'
  workflow_dispatch:

# Several crons read a playlist another one writes, so they never overlap
concurrency:
  group: dzr-crons
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: new-releases
      action: new-releases
      arguments: |
        {
          "access_token": "$MY_ACCESS_TOKEN",
          "playlistId": 15160366983,
          "days": 15
        }
    secrets: inherit
