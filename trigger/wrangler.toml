# Cloudflare Worker that asks GitHub to run the crons, because GitHub's own
# scheduler never does. See trigger/README.md.
#
# These schedules mirror .github/workflows/cron-*.yml one for one. Cloudflare
# reads them in UTC, like GitHub, so a workflow's cron and its line here stay
# the same string. Change one, change the other.
name = "dzr-cron-trigger"
main = "worker.js"
compatibility_date = "2026-09-16"

[triggers]
crons = [
  "23 * * * *",  # family-playlist
  "33 * * * *",  # car-playlist
  "43 * * * *",  # lucas
  "53 * * * *",  # thibaut
  "26 23 * * *", # remove-duplicates
]
