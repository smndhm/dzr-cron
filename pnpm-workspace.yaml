# pnpm 12 no longer reads settings from the "pnpm" field of package.json, and
# onlyBuiltDependencies became allowBuilds. esbuild is what vitest builds on,
# and it needs its install script to put its binary in place.
allowBuilds:
  esbuild: true

# My own packages (smndhm/dev-config) can be used as soon as they are published
minimumReleaseAgeExclude:
  - '@dume/*'
